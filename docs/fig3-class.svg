<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="940" fill="#ffffff"/>
  <defs>
    <marker id="dep" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== Controller 层 ===== -->
  <rect x="30" y="20" width="1140" height="180" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="50" font-size="17" font-weight="bold" fill="#5B21B6">Controller 表现层（org.springframework.stereotype.Controller）</text>
  <!-- UserController -->
  <g>
    <rect x="50" y="66" width="200" height="120" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
    <rect x="50" y="66" width="200" height="30" fill="#EDE9FE"/>
    <text x="150" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C1D95">UserController</text>
    <text x="62" y="116" font-size="13" fill="#334155">+ login(): String</text>
    <text x="62" y="137" font-size="13" fill="#334155">+ register(): String</text>
    <text x="62" y="158" font-size="13" fill="#334155">+ logout(): String</text>
    <text x="62" y="179" font-size="13" fill="#334155">+ adminList(): String</text>
  </g>
  <!-- VenueController -->
  <g>
    <rect x="280" y="66" width="210" height="120" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
    <rect x="280" y="66" width="210" height="30" fill="#EDE9FE"/>
    <text x="385" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C1D95">VenueController</text>
    <text x="292" y="116" font-size="13" fill="#334155">+ list(): String</text>
    <text x="292" y="137" font-size="13" fill="#334155">+ save(): String</text>
    <text x="292" y="158" font-size="13" fill="#334155">+ edit(): String</text>
    <text x="292" y="179" font-size="13" fill="#334155">+ delete(): String</text>
  </g>
  <!-- ReservationController -->
  <g>
    <rect x="520" y="66" width="230" height="120" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
    <rect x="520" y="66" width="230" height="30" fill="#EDE9FE"/>
    <text x="635" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C1D95">ReservationController</text>
    <text x="532" y="116" font-size="13" fill="#334155">+ create(): String</text>
    <text x="532" y="137" font-size="13" fill="#334155">+ cancel(): String</text>
    <text x="532" y="158" font-size="13" fill="#334155">+ myList(): String</text>
    <text x="532" y="179" font-size="13" fill="#334155">+ confirm()/finish()</text>
  </g>
  <!-- ReviewController / CategoryController -->
  <g>
    <rect x="780" y="66" width="180" height="120" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
    <rect x="780" y="66" width="180" height="30" fill="#EDE9FE"/>
    <text x="870" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C1D95">ReviewController</text>
    <text x="792" y="116" font-size="13" fill="#334155">+ add(): String</text>
    <text x="792" y="137" font-size="13" fill="#334155">+ listByVenue()</text>
    <text x="792" y="158" font-size="13" fill="#334155">+ delete(): String</text>
  </g>
  <g>
    <rect x="990" y="66" width="180" height="120" fill="#ffffff" stroke="#7C3AED" stroke-width="2"/>
    <rect x="990" y="66" width="180" height="30" fill="#EDE9FE"/>
    <text x="1080" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C1D95">CategoryController</text>
    <text x="1002" y="116" font-size="13" fill="#334155">+ list(): String</text>
    <text x="1002" y="137" font-size="13" fill="#334155">+ save(): String</text>
    <text x="1002" y="158" font-size="13" fill="#334155">+ delete(): String</text>
  </g>

  <!-- ===== Service 层 ===== -->
  <rect x="30" y="230" width="1140" height="210" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="260" font-size="17" font-weight="bold" fill="#166534">Service 业务层（接口 + 实现类，@Service / @Transactional）</text>
  <!-- UserService -->
  <g>
    <rect x="50" y="276" width="220" height="150" fill="#ffffff" stroke="#16A34A" stroke-width="2"/>
    <rect x="50" y="276" width="220" height="30" fill="#DCFCE7"/>
    <text x="160" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532D">«interface» UserService</text>
    <text x="62" y="326" font-size="13" fill="#334155">+ login(name, pwd): User</text>
    <text x="62" y="347" font-size="13" fill="#334155">+ register(User): void</text>
    <text x="62" y="368" font-size="13" fill="#334155">+ changeStatus(id,st): void</text>
    <text x="62" y="389" font-size="13" fill="#334155">+ delete(id): void</text>
    <text x="62" y="410" font-size="13" fill="#334155">+ listAll(): List&lt;User&gt;</text>
  </g>
  <!-- ReservationService -->
  <g>
    <rect x="300" y="276" width="280" height="150" fill="#ffffff" stroke="#16A34A" stroke-width="2"/>
    <rect x="300" y="276" width="280" height="30" fill="#DCFCE7"/>
    <text x="440" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532D">«interface» ReservationService</text>
    <text x="312" y="326" font-size="13" fill="#334155">+ create(Reservation): void</text>
    <text x="312" y="347" font-size="13" fill="#334155">+ checkConflict(vid, start, end): boolean</text>
    <text x="312" y="368" font-size="13" fill="#334155">+ calcPrice(price, start, end): BigDecimal</text>
    <text x="312" y="389" font-size="13" fill="#334155">+ cancel(id, userId): void</text>
    <text x="312" y="410" font-size="13" fill="#334155">+ updateStatus(id, status): void</text>
  </g>
  <!-- VenueService / ReviewService -->
  <g>
    <rect x="610" y="276" width="260" height="150" fill="#ffffff" stroke="#16A34A" stroke-width="2"/>
    <rect x="610" y="276" width="260" height="30" fill="#DCFCE7"/>
    <text x="740" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532D">«interface» VenueService</text>
    <text x="622" y="326" font-size="13" fill="#334155">+ listAll(): List&lt;Venue&gt;</text>
    <text x="622" y="347" font-size="13" fill="#334155">+ detail(id): Venue</text>
    <text x="622" y="368" font-size="13" fill="#334155">+ search(kw, categoryId): List</text>
    <text x="622" y="389" font-size="13" fill="#334155">+ save(Venue) / delete(id)</text>
  </g>
  <g>
    <rect x="900" y="276" width="260" height="150" fill="#ffffff" stroke="#16A34A" stroke-width="2"/>
    <rect x="900" y="276" width="260" height="30" fill="#DCFCE7"/>
    <text x="1030" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532D">«interface» ReviewService</text>
    <text x="912" y="326" font-size="13" fill="#334155">+ add(Review): void</text>
    <text x="912" y="347" font-size="13" fill="#334155">+ listByVenue(vid): List</text>
    <text x="912" y="368" font-size="13" fill="#334155">+ listAll(): List&lt;Review&gt;</text>
    <text x="912" y="389" font-size="13" fill="#334155">+ delete(id): void</text>
  </g>

  <!-- ===== Mapper 层 ===== -->
  <rect x="30" y="470" width="1140" height="150" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="500" font-size="17" font-weight="bold" fill="#9A3412">Mapper 持久层（MyBatis 接口 + XML 映射）</text>
  <g font-size="14" fill="#334155">
    <rect x="50" y="516" width="200" height="86" rx="6" fill="#ffffff" stroke="#EA580C" stroke-width="1.8"/>
    <text x="150" y="545" text-anchor="middle" font-weight="bold" fill="#7C2D12">UserMapper</text>
    <text x="150" y="570" text-anchor="middle" font-size="13">selectByName()</text>
    <text x="150" y="590" text-anchor="middle" font-size="13">insert / update / delete</text>
    <rect x="290" y="516" width="200" height="86" rx="6" fill="#ffffff" stroke="#EA580C" stroke-width="1.8"/>
    <text x="390" y="545" text-anchor="middle" font-weight="bold" fill="#7C2D12">VenueMapper</text>
    <text x="390" y="570" text-anchor="middle" font-size="13">selectList / selectDetail</text>
    <text x="390" y="590" text-anchor="middle" font-size="13">动态SQL多条件查询</text>
    <rect x="530" y="516" width="200" height="86" rx="6" fill="#ffffff" stroke="#EA580C" stroke-width="1.8"/>
    <text x="630" y="545" text-anchor="middle" font-weight="bold" fill="#7C2D12">ReservationMapper</text>
    <text x="630" y="570" text-anchor="middle" font-size="13">selectConflicts()</text>
    <text x="630" y="590" text-anchor="middle" font-size="13">insert / updateStatus</text>
    <rect x="770" y="516" width="200" height="86" rx="6" fill="#ffffff" stroke="#EA580C" stroke-width="1.8"/>
    <text x="870" y="545" text-anchor="middle" font-weight="bold" fill="#7C2D12">ReviewMapper</text>
    <text x="870" y="570" text-anchor="middle" font-size="13">selectByVenueId()</text>
    <text x="870" y="590" text-anchor="middle" font-size="13">avgRating 聚合统计</text>
    <rect x="1010" y="516" width="160" height="86" rx="6" fill="#ffffff" stroke="#EA580C" stroke-width="1.8"/>
    <text x="1090" y="545" text-anchor="middle" font-weight="bold" fill="#7C2D12">CategoryMapper</text>
    <text x="1090" y="570" text-anchor="middle" font-size="13">CRUD</text>
    <text x="1090" y="590" text-anchor="middle" font-size="13">countById</text>
  </g>

  <!-- ===== Entity 层 ===== -->
  <rect x="30" y="650" width="1140" height="270" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="680" font-size="17" font-weight="bold" fill="#334155">Entity 实体层（与数据库表一一对应）</text>
  <!-- User 实体 -->
  <g>
    <rect x="60" y="696" width="240" height="200" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect x="60" y="696" width="240" height="30" fill="#E2E8F0"/>
    <text x="180" y="717" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">User</text>
    <text x="72" y="746" font-size="13" fill="#334155">- id: Long</text>
    <text x="72" y="767" font-size="13" fill="#334155">- username: String</text>
    <text x="72" y="788" font-size="13" fill="#334155">- password: String</text>
    <text x="72" y="809" font-size="13" fill="#334155">- realName: String</text>
    <text x="72" y="830" font-size="13" fill="#334155">- phone: String</text>
    <text x="72" y="851" font-size="13" fill="#334155">- role: Integer（0用户/1管理员）</text>
    <text x="72" y="872" font-size="13" fill="#334155">- status: Integer</text>
    <line x1="60" y1="736" x2="300" y2="736" stroke="#CBD5E1"/>
  </g>
  <!-- Reservation 实体 -->
  <g>
    <rect x="330" y="696" width="270" height="200" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect x="330" y="696" width="270" height="30" fill="#E2E8F0"/>
    <text x="465" y="717" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">Reservation</text>
    <text x="342" y="746" font-size="13" fill="#334155">- id: Long</text>
    <text x="342" y="767" font-size="13" fill="#334155">- userId / venueId: Long</text>
    <text x="342" y="788" font-size="13" fill="#334155">- startTime: Date</text>
    <text x="342" y="809" font-size="13" fill="#334155">- endTime: Date</text>
    <text x="342" y="830" font-size="13" fill="#334155">- totalPrice: BigDecimal</text>
    <text x="342" y="851" font-size="13" fill="#334155">- status: Integer</text>
    <text x="342" y="872" font-size="13" fill="#334155">（0待确认/1已确认/2完成/3取消）</text>
    <line x1="330" y1="736" x2="600" y2="736" stroke="#CBD5E1"/>
  </g>
  <!-- Venue / Review / Category 实体 -->
  <g>
    <rect x="630" y="696" width="250" height="130" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect x="630" y="696" width="250" height="30" fill="#E2E8F0"/>
    <text x="755" y="717" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">Venue</text>
    <text x="642" y="746" font-size="13" fill="#334155">- id / categoryId: Long</text>
    <text x="642" y="767" font-size="13" fill="#334155">- name / location: String</text>
    <text x="642" y="788" font-size="13" fill="#334155">- capacity: Integer</text>
    <text x="642" y="809" font-size="13" fill="#334155">- price: BigDecimal（元/小时）</text>
    <line x1="630" y1="736" x2="880" y2="736" stroke="#CBD5E1"/>
  </g>
  <g>
    <rect x="910" y="696" width="250" height="130" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect x="910" y="696" width="250" height="30" fill="#E2E8F0"/>
    <text x="1035" y="717" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">Review</text>
    <text x="922" y="746" font-size="13" fill="#334155">- id / userId / venueId: Long</text>
    <text x="922" y="767" font-size="13" fill="#334155">- rating: Integer（1~5）</text>
    <text x="922" y="788" font-size="13" fill="#334155">- content: String</text>
    <text x="922" y="809" font-size="13" fill="#334155">- createTime: Date</text>
    <line x1="910" y1="736" x2="1160" y2="736" stroke="#CBD5E1"/>
  </g>
  <g>
    <rect x="630" y="846" width="250" height="60" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect x="630" y="846" width="250" height="26" fill="#E2E8F0"/>
    <text x="755" y="865" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Category</text>
    <text x="642" y="893" font-size="13" fill="#334155">- id: Long　- name / description: String</text>
  </g>
  <!-- 依赖箭头 -->
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#dep)" fill="none">
    <path d="M600 200 L470 272"/>
    <path d="M160 200 L150 272"/>
    <path d="M1050 200 L1030 272"/>
    <path d="M160 428 L150 512"/>
    <path d="M440 428 L630 512"/>
    <path d="M1030 428 L1030 512"/>
    <path d="M440 428 L430 694"/>
    <path d="M150 428 L180 694"/>
    <path d="M740 428 L730 694"/>
    <path d="M1030 428 L1035 694"/>
  </g>
</svg>
