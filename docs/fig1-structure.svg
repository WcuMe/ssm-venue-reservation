<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- 根节点 -->
  <rect x="450" y="30" width="300" height="64" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="600" y="70" text-anchor="middle" font-size="26" font-weight="bold" fill="#312E81">体育场馆预约系统</text>
  <!-- 连接线 -->
  <g stroke="#64748B" stroke-width="1.8" fill="none">
    <path d="M600 94 L600 130"/>
    <path d="M130 130 L1070 130"/>
    <path d="M130 130 L130 168"/>
    <path d="M360 130 L360 168"/>
    <path d="M600 130 L600 168"/>
    <path d="M840 130 L840 168"/>
    <path d="M1070 130 L1070 168"/>
  </g>
  <!-- 五大模块 -->
  <g>
    <rect x="35" y="168" width="190" height="52" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="130" y="201" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">用户管理</text>
    <rect x="265" y="168" width="190" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="360" y="201" text-anchor="middle" font-size="20" font-weight="bold" fill="#9A3412">场地管理</text>
    <rect x="495" y="168" width="190" height="52" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text x="590" y="201" text-anchor="middle" font-size="20" font-weight="bold" fill="#9D174D">预约管理</text>
    <rect x="725" y="168" width="190" height="52" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
    <text x="820" y="201" text-anchor="middle" font-size="20" font-weight="bold" fill="#155E75">分类管理</text>
    <rect x="955" y="168" width="190" height="52" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
    <text x="1050" y="201" text-anchor="middle" font-size="20" font-weight="bold" fill="#854D0E">评价管理</text>
  </g>
  <!-- 模块到子功能的连线 -->
  <g stroke="#94A3B8" stroke-width="1.4" fill="none">
    <path d="M130 220 L130 248"/>
    <path d="M360 220 L360 248"/>
    <path d="M590 220 L590 248"/>
    <path d="M820 220 L820 248"/>
    <path d="M1050 220 L1050 248"/>
  </g>
  <!-- 子功能卡片 -->
  <g font-size="16" fill="#1F2937">
    <!-- 用户管理 -->
    <g>
      <rect x="35" y="248" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="130" y="276" text-anchor="middle">用户注册 / 登录</text>
      <rect x="35" y="300" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="130" y="328" text-anchor="middle">角色权限控制</text>
      <rect x="35" y="352" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="130" y="380" text-anchor="middle">账号禁用 / 启用</text>
      <rect x="35" y="404" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="130" y="432" text-anchor="middle">用户信息维护</text>
    </g>
    <!-- 场地管理 -->
    <g>
      <rect x="265" y="248" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="360" y="276" text-anchor="middle">场地增删改查</text>
      <rect x="265" y="300" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="360" y="328" text-anchor="middle">开放 / 关闭场地</text>
      <rect x="265" y="352" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="360" y="380" text-anchor="middle">按分类筛选</text>
      <rect x="265" y="404" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="360" y="432" text-anchor="middle">关键词搜索</text>
    </g>
    <!-- 预约管理 -->
    <g>
      <rect x="495" y="248" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="590" y="276" text-anchor="middle">在线提交预约</text>
      <rect x="495" y="300" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="590" y="328" text-anchor="middle">时间冲突校验</text>
      <rect x="495" y="352" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="590" y="380" text-anchor="middle">费用自动计算</text>
      <rect x="495" y="404" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="590" y="432" text-anchor="middle">状态流转 / 取消</text>
      <rect x="495" y="456" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="590" y="484" text-anchor="middle">我的预约查询</text>
    </g>
    <!-- 分类管理 -->
    <g>
      <rect x="725" y="248" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="820" y="276" text-anchor="middle">分类增删改查</text>
      <rect x="725" y="300" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="820" y="328" text-anchor="middle">分类关联校验</text>
      <rect x="725" y="352" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="820" y="380" text-anchor="middle">分类下场地统计</text>
    </g>
    <!-- 评价管理 -->
    <g>
      <rect x="955" y="248" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="1050" y="276" text-anchor="middle">评分与评论</text>
      <rect x="955" y="300" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="1050" y="328" text-anchor="middle">平均分自动统计</text>
      <rect x="955" y="352" width="190" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="1050" y="380" text-anchor="middle">违规评价删除</text>
    </g>
  </g>
  <!-- 前后台划分 -->
  <g stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" fill="none">
    <rect x="20" y="530" width="690" height="60"/>
    <rect x="712" y="530" width="468" height="60"/>
  </g>
  <text x="365" y="566" text-anchor="middle" font-size="17" fill="#334155">前台功能（普通用户 / 游客浏览）</text>
  <text x="946" y="566" text-anchor="middle" font-size="17" fill="#334155">后台管理功能（管理员）</text>
  <!-- 底部技术说明 -->
  <rect x="20" y="630" width="1160" height="160" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="40" y="665" font-size="18" font-weight="bold" fill="#334155">技术架构：SSM（Spring + SpringMVC + MyBatis）+ JSP</text>
  <text x="40" y="698" font-size="16" fill="#475569">表现层：JSP 页面 + SpringMVC Controller（拦截器实现登录校验与角色权限控制）</text>
  <text x="40" y="728" font-size="16" fill="#475569">业务层：Spring IoC 管理Service Bean，声明式事务 @Transactional 保证预约等写操作一致性</text>
  <text x="40" y="758" font-size="16" fill="#475569">持久层：MyBatis Mapper 接口 + XML 映射（动态 SQL 实现多条件查询），MySQL 8 数据库</text>
</svg>
