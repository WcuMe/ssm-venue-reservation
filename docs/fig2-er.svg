<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1080" height="920" fill="#ffffff"/>
  <defs>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ========== 实体卡片 ========== -->
  <!-- 用户 -->
  <g>
    <rect x="60" y="50" width="250" height="200" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="60" y="50" width="250" height="34" fill="#4F46E5"/>
    <text x="185" y="73" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">用户 user</text>
    <g font-size="14" fill="#1E293B">
      <text x="76" y="110" font-weight="bold">用户ID（主键）</text>
      <text x="76" y="133">用户名</text>
      <text x="76" y="156">密码</text>
      <text x="76" y="179">真实姓名</text>
      <text x="76" y="202">联系电话</text>
      <text x="76" y="225">角色（0用户/1管理员）</text>
      <text x="76" y="248">状态（0禁用/1正常）</text>
    </g>
  </g>
  <!-- 预约 -->
  <g>
    <rect x="770" y="50" width="250" height="200" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <rect x="770" y="50" width="250" height="34" fill="#DB2777"/>
    <text x="895" y="73" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">预约 reservation</text>
    <g font-size="14" fill="#1E293B">
      <text x="786" y="110" font-weight="bold">预约ID（主键）</text>
      <text x="786" y="133">用户ID（外键→user）</text>
      <text x="786" y="156">场地ID（外键→venue）</text>
      <text x="786" y="179">开始时间</text>
      <text x="786" y="202">结束时间</text>
      <text x="786" y="225">总价（自动计算）</text>
      <text x="786" y="248">状态 / 备注</text>
    </g>
  </g>
  <!-- 评价 -->
  <g>
    <rect x="60" y="560" width="250" height="200" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
    <rect x="60" y="560" width="250" height="34" fill="#CA8A04"/>
    <text x="185" y="583" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">评价 review</text>
    <g font-size="14" fill="#1E293B">
      <text x="76" y="620" font-weight="bold">评价ID（主键）</text>
      <text x="76" y="643">用户ID（外键→user）</text>
      <text x="76" y="666">场地ID（外键→venue）</text>
      <text x="76" y="689">评分（1~5星）</text>
      <text x="76" y="712">评价内容</text>
      <text x="76" y="735">创建时间</text>
    </g>
  </g>
  <!-- 场地 -->
  <g>
    <rect x="770" y="560" width="250" height="200" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <rect x="770" y="560" width="250" height="34" fill="#EA580C"/>
    <text x="895" y="583" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">场地 venue</text>
    <g font-size="14" fill="#1E293B">
      <text x="786" y="620" font-weight="bold">场地ID（主键）</text>
      <text x="786" y="643">分类ID（外键→category）</text>
      <text x="786" y="666">场地名称</text>
      <text x="786" y="689">位置 / 容纳人数</text>
      <text x="786" y="712">价格（元/小时）</text>
      <text x="786" y="735">状态 / 平均评分</text>
    </g>
  </g>
  <!-- 分类 -->
  <g>
    <rect x="420" y="380" width="240" height="140" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
    <rect x="420" y="380" width="240" height="34" fill="#0891B2"/>
    <text x="540" y="403" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">分类 category</text>
    <g font-size="14" fill="#1E293B">
      <text x="436" y="440" font-weight="bold">分类ID（主键）</text>
      <text x="436" y="463">分类名称</text>
      <text x="436" y="486">分类描述</text>
    </g>
  </g>

  <!-- ========== 关系连线 ========== -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <!-- 用户-预约（横线） -->
    <line x1="310" y1="150" x2="770" y2="150"/>
    <!-- 用户-评价（竖线） -->
    <line x1="185" y1="250" x2="185" y2="560"/>
    <!-- 场地-预约（竖线） -->
    <line x1="895" y1="560" x2="895" y2="250"/>
    <!-- 场地-评价（横线） -->
    <line x1="770" y1="660" x2="310" y2="660"/>
    <!-- 分类-场地（折线） -->
    <path d="M660 450 L 720 450 L 720 640 L 770 640"/>
    <!-- 分类-用户侧无关系 -->
  </g>

  <!-- 关系名菱形 -->
  <g>
    <path d="M540 120 L 580 150 L 540 180 L 500 150 Z" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
    <text x="540" y="156" text-anchor="middle" font-size="15" fill="#9D174D">发起</text>
    <path d="M185 380 L 225 405 L 185 430 L 145 405 Z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.8"/>
    <text x="185" y="411" text-anchor="middle" font-size="15" fill="#854D0E">发表</text>
    <path d="M895 380 L 935 405 L 895 430 L 855 405 Z" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
    <text x="895" y="411" text-anchor="middle" font-size="15" fill="#9D174D">被预约</text>
    <path d="M540 630 L 580 655 L 540 680 L 500 655 Z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.8"/>
    <text x="540" y="661" text-anchor="middle" font-size="15" fill="#854D0E">被评价</text>
    <path d="M720 530 L 762 555 L 720 580 L 678 555 Z" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/>
    <text x="720" y="561" text-anchor="middle" font-size="15" fill="#155E75">归属</text>
  </g>

  <!-- 基数标注 -->
  <g font-size="16" font-weight="bold" fill="#334155">
    <text x="322" y="140">1</text>
    <text x="745" y="140">n</text>
    <text x="195" y="270">1</text>
    <text x="195" y="545">n</text>
    <text x="905" y="275">n</text>
    <text x="905" y="545">1</text>
    <text x="745" y="648">1</text>
    <text x="322" y="648">n</text>
    <text x="672" y="440">1</text>
    <text x="755" y="628">n</text>
  </g>

  <!-- 图例 -->
  <g font-size="14" fill="#475569">
    <rect x="60" y="820" width="960" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="80" y="850">说明：矩形为实体（表），菱形为实体间联系，连线两端标注联系基数（1:1 / 1:n）。</text>
    <text x="80" y="878">用户与场地为 n:m 多对多联系，通过“预约”“评价”两个联系实体实现；分类与场地为 1:n 一对多联系。</text>
  </g>
</svg>
