<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e6fff"/>
      <stop offset="100%" stop-color="#0f4c9c"/>
    </linearGradient>
    <linearGradient id="laneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f8ff"/>
      <stop offset="100%" stop-color="#e6efff"/>
    </linearGradient>
    <linearGradient id="laneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf2ff"/>
      <stop offset="100%" stop-color="#dbe8ff"/>
    </linearGradient>
  </defs>

  <rect width="1160" height="720" fill="#ffffff"/>

  <!-- 顶部标题 -->
  <rect x="40" y="26" width="1080" height="66" rx="10" fill="url(#topbar)"/>
  <text x="580" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">体育场馆预约系统 · 功能结构图</text>
  <text x="580" y="82" text-anchor="middle" font-size="14" fill="#cfe0ff">按使用角色划分为用户端泳道与管理端泳道，两端共享同一数据访问层</text>

  <!-- ============ 泳道 A：用户端 ============ -->
  <rect x="40" y="118" width="1080" height="212" rx="10" fill="url(#laneA)" stroke="#c7dbff" stroke-width="1.5"/>
  <rect x="40" y="118" width="8" height="212" rx="4" fill="#1e6fff"/>
  <text x="66" y="152" font-size="18" font-weight="700" fill="#0f4c9c">用户端（普通注册用户）</text>
  <text x="228" y="152" font-size="13" fill="#5a7bb0">浏览 · 预约 · 评价</text>

  <!-- 用户端 4 个模块 -->
  <g>
    <rect x="66" y="172" width="240" height="134" rx="8" fill="#ffffff" stroke="#1e6fff" stroke-width="2"/>
    <rect x="66" y="172" width="240" height="34" rx="8" fill="#1e6fff"/>
    <text x="186" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">场地检索</text>
    <text x="84" y="228" font-size="12.5" fill="#334155">· 场地列表与详情浏览</text>
    <text x="84" y="250" font-size="12.5" fill="#334155">· 按分类筛选</text>
    <text x="84" y="272" font-size="12.5" fill="#334155">· 关键词模糊搜索</text>
    <text x="84" y="294" font-size="12.5" fill="#334155">· 查看评分与评价</text>
  </g>
  <g>
    <rect x="326" y="172" width="240" height="134" rx="8" fill="#ffffff" stroke="#1e6fff" stroke-width="2"/>
    <rect x="326" y="172" width="240" height="34" rx="8" fill="#1e6fff"/>
    <text x="446" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">在线预约</text>
    <text x="344" y="228" font-size="12.5" fill="#334155">· 选择时段提交预约</text>
    <text x="344" y="250" font-size="12.5" fill="#334155">· 冲突检测与提示</text>
    <text x="344" y="272" font-size="12.5" fill="#334155">· 费用自动计算</text>
    <text x="344" y="294" font-size="12.5" fill="#334155">· 生成预约单号</text>
  </g>
  <g>
    <rect x="586" y="172" width="240" height="134" rx="8" fill="#ffffff" stroke="#1e6fff" stroke-width="2"/>
    <rect x="586" y="172" width="240" height="34" rx="8" fill="#1e6fff"/>
    <text x="706" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">我的预约</text>
    <text x="604" y="228" font-size="12.5" fill="#334155">· 查看本人预约记录</text>
    <text x="604" y="250" font-size="12.5" fill="#334155">· 追踪预约状态流转</text>
    <text x="604" y="272" font-size="12.5" fill="#334155">· 取消待确认/已确认单</text>
    <text x="604" y="294" font-size="12.5" fill="#334155">· 查看费用明细</text>
  </g>
  <g>
    <rect x="846" y="172" width="240" height="134" rx="8" fill="#ffffff" stroke="#1e6fff" stroke-width="2"/>
    <rect x="846" y="172" width="240" height="34" rx="8" fill="#1e6fff"/>
    <text x="966" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">评价反馈</text>
    <text x="864" y="228" font-size="12.5" fill="#334155">· 1~5 星评分</text>
    <text x="864" y="250" font-size="12.5" fill="#334155">· 文字评论</text>
    <text x="864" y="272" font-size="12.5" fill="#334155">· 评分汇总至场地</text>
    <text x="864" y="294" font-size="12.5" fill="#334155">· 浏览他人评价</text>
  </g>

  <!-- ============ 泳道 B：管理端 ============ -->
  <rect x="40" y="352" width="1080" height="212" rx="10" fill="url(#laneB)" stroke="#b9d0f5" stroke-width="1.5"/>
  <rect x="40" y="352" width="8" height="212" rx="4" fill="#0f4c9c"/>
  <text x="66" y="386" font-size="18" font-weight="700" fill="#0f4c9c">管理端（系统管理员）</text>
  <text x="252" y="386" font-size="13" fill="#5a7bb0">五大管理模块 · 需 ADMIN 角色且通过登录拦截器校验</text>

  <!-- 管理端 5 个模块 -->
  <g>
    <rect x="66" y="406" width="188" height="134" rx="8" fill="#ffffff" stroke="#0f4c9c" stroke-width="2"/>
    <rect x="66" y="406" width="188" height="34" rx="8" fill="#0f4c9c"/>
    <text x="160" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">用户管理</text>
    <text x="84" y="462" font-size="12.5" fill="#334155">· 账号列表查询</text>
    <text x="84" y="484" font-size="12.5" fill="#334155">· 禁用 / 启用</text>
    <text x="84" y="506" font-size="12.5" fill="#334155">· 删除账号</text>
    <text x="84" y="528" font-size="12.5" fill="#334155">· 角色区分</text>
  </g>
  <g>
    <rect x="270" y="406" width="188" height="134" rx="8" fill="#ffffff" stroke="#0f4c9c" stroke-width="2"/>
    <rect x="270" y="406" width="188" height="34" rx="8" fill="#0f4c9c"/>
    <text x="364" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">场地管理</text>
    <text x="288" y="462" font-size="12.5" fill="#334155">· 场地新增与编辑</text>
    <text x="288" y="484" font-size="12.5" fill="#334155">· 开放 / 关闭</text>
    <text x="288" y="506" font-size="12.5" fill="#334155">· 分类归属设置</text>
    <text x="288" y="528" font-size="12.5" fill="#334155">· 删除场地</text>
  </g>
  <g>
    <rect x="474" y="406" width="188" height="134" rx="8" fill="#ffffff" stroke="#0f4c9c" stroke-width="2"/>
    <rect x="474" y="406" width="188" height="34" rx="8" fill="#0f4c9c"/>
    <text x="568" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">预约管理</text>
    <text x="492" y="462" font-size="12.5" fill="#334155">· 全量预约单查询</text>
    <text x="492" y="484" font-size="12.5" fill="#334155">· 确认预约</text>
    <text x="492" y="506" font-size="12.5" fill="#334155">· 标记完成</text>
    <text x="492" y="528" font-size="12.5" fill="#334155">· 删除无效单</text>
  </g>
  <g>
    <rect x="678" y="406" width="188" height="134" rx="8" fill="#ffffff" stroke="#0f4c9c" stroke-width="2"/>
    <rect x="678" y="406" width="188" height="34" rx="8" fill="#0f4c9c"/>
    <text x="772" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">分类管理</text>
    <text x="696" y="462" font-size="12.5" fill="#334155">· 分类新增与编辑</text>
    <text x="696" y="484" font-size="12.5" fill="#334155">· 排序调整</text>
    <text x="696" y="506" font-size="12.5" fill="#334155">· 关联场地校验</text>
    <text x="696" y="528" font-size="12.5" fill="#334155">· 删除分类</text>
  </g>
  <g>
    <rect x="882" y="406" width="188" height="134" rx="8" fill="#ffffff" stroke="#0f4c9c" stroke-width="2"/>
    <rect x="882" y="406" width="188" height="34" rx="8" fill="#0f4c9c"/>
    <text x="976" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">评价管理</text>
    <text x="900" y="462" font-size="12.5" fill="#334155">· 评价列表查询</text>
    <text x="900" y="484" font-size="12.5" fill="#334155">· 按场地查看</text>
    <text x="900" y="506" font-size="12.5" fill="#334155">· 违规评价删除</text>
    <text x="900" y="528" font-size="12.5" fill="#334155">· 评分实时汇总</text>
  </g>

  <!-- ============ 共享数据访问层 ============ -->
  <path d="M580 564 L580 592" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="180" y="596" width="800" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">共享数据访问层：Spring Service（事务控制） → MyBatis Mapper → MySQL</text>
  <text x="580" y="650" text-anchor="middle" font-size="13" fill="#64748b">用户端与管理端复用同一套 Service 与 Mapper，通过拦截器区分可访问的操作集合</text>
  <text x="580" y="670" text-anchor="middle" font-size="13" fill="#64748b">评分统计采用关联子查询实时聚合（AVG / COUNT），不在场地表中冗余存储</text>
</svg>
