<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="864" viewBox="0 0 1180 864" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="dep" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#64748b" stroke-width="1.8"/>
    </marker>
    <marker id="impl" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L12,7 L1,13 z" fill="#ffffff" stroke="#1e6fff" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1180" height="864" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f4c9c">体育场馆预约系统 核心类图</text>
  <text x="590" y="60" text-anchor="middle" font-size="13" fill="#5a7bb0">SSM 三层调用链：Controller（接收请求） → Service 接口与实现（业务与事务） → Mapper（数据访问）</text>

  <!-- ================= 实体层（共享数据载体） ================= -->
  <rect x="40" y="84" width="1100" height="112" rx="10" fill="#f3f8ff" stroke="#c7dbff" stroke-width="1.5"/>
  <text x="60" y="110" font-size="14" font-weight="700" fill="#0f4c9c">entity 实体层</text>
  <text x="168" y="110" font-size="12" fill="#5a7bb0">（POJO，Lombok @Data 生成 getter/setter，贯穿各层传输数据）</text>

  <g>
    <rect x="60" y="124" width="196" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="158" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f4c9c">User</text>
    <text x="158" y="166" text-anchor="middle" font-size="11.5" fill="#475569">id / username / role / status</text>
  </g>
  <g>
    <rect x="270" y="124" width="196" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="368" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f4c9c">Venue</text>
    <text x="368" y="166" text-anchor="middle" font-size="11.5" fill="#475569">id / categoryId / pricePerHour</text>
  </g>
  <g>
    <rect x="480" y="124" width="196" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="578" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f4c9c">Category</text>
    <text x="578" y="166" text-anchor="middle" font-size="11.5" fill="#475569">id / name / sortOrder</text>
  </g>
  <g>
    <rect x="690" y="124" width="196" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="788" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f4c9c">Reservation</text>
    <text x="788" y="166" text-anchor="middle" font-size="11.5" fill="#475569">orderNo / startTime / status</text>
  </g>
  <g>
    <rect x="900" y="124" width="220" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="1010" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f4c9c">Review</text>
    <text x="1010" y="166" text-anchor="middle" font-size="11.5" fill="#475569">userId / venueId / rating</text>
  </g>

  <!-- ================= 第一栏：Controller ================= -->
  <rect x="40" y="230" width="300" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="258" font-size="14" font-weight="700" fill="#334155">controller 控制层</text>
  <text x="60" y="278" font-size="11.5" fill="#64748b">@Controller · 解析参数 · 返回 JSP 视图或 JSON</text>

  <g>
    <rect x="60" y="294" width="260" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="76" y="316" font-size="13" font-weight="700" fill="#0f4c9c">PageController</text>
    <text x="76" y="336" font-size="11.5" fill="#475569">首页 / 登录 / 注册 / 场地详情跳转</text>
  </g>
  <g>
    <rect x="60" y="362" width="260" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="76" y="384" font-size="13" font-weight="700" fill="#0f4c9c">VenueController</text>
    <text x="76" y="404" font-size="11.5" fill="#475569">场地增删改查 / 开放关闭</text>
  </g>
  <g>
    <rect x="60" y="430" width="260" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="76" y="452" font-size="13" font-weight="700" fill="#0f4c9c">ReservationController</text>
    <text x="76" y="472" font-size="11.5" fill="#475569">提交预约 / 取消 / 确认 / 完成</text>
  </g>
  <g>
    <rect x="60" y="498" width="260" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="76" y="520" font-size="13" font-weight="700" fill="#0f4c9c">ReviewController</text>
    <text x="76" y="540" font-size="11.5" fill="#475569">提交评价 / 列表 / 删除</text>
  </g>
  <g>
    <rect x="60" y="566" width="260" height="56" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="76" y="588" font-size="13" font-weight="700" fill="#0f4c9c">UserController / CategoryController</text>
    <text x="76" y="608" font-size="11.5" fill="#475569">用户管理与分类管理（仅 ADMIN）</text>
  </g>

  <!-- Controller → Service 依赖 -->
  <path d="M300 322 L420 322" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dep)"/>
  <path d="M300 458 L420 458" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dep)"/>
  <path d="M300 594 L420 594" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dep)"/>

  <!-- ================= 第二栏：Service ================= -->
  <rect x="430" y="230" width="330" height="440" rx="10" fill="#eef4ff" stroke="#b9d0f5" stroke-width="1.5"/>
  <text x="450" y="258" font-size="14" font-weight="700" fill="#0f4c9c">service 业务层</text>
  <text x="450" y="278" font-size="11.5" fill="#5a7bb0">@Service · @Transactional 声明式事务 · 业务规则校验</text>

  <g>
    <rect x="450" y="294" width="290" height="76" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="466" y="314" font-size="12" font-weight="700" fill="#1e6fff">«interface» UserService</text>
    <text x="466" y="334" font-size="11.5" fill="#334155">login / register / listAll</text>
    <text x="466" y="354" font-size="11.5" fill="#475569">↳ UserServiceImpl　@Transactional</text>
  </g>
  <g>
    <rect x="450" y="380" width="290" height="76" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="466" y="400" font-size="12" font-weight="700" fill="#1e6fff">«interface» VenueService</text>
    <text x="466" y="420" font-size="11.5" fill="#334155">listOpen / detail / save / updateStatus</text>
    <text x="466" y="440" font-size="11.5" fill="#475569">↳ VenueServiceImpl</text>
  </g>
  <g>
    <rect x="450" y="466" width="290" height="76" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="466" y="486" font-size="12" font-weight="700" fill="#1e6fff">«interface» ReservationService</text>
    <text x="466" y="506" font-size="11.5" fill="#334155">create / cancel / confirm / finish</text>
    <text x="466" y="526" font-size="11.5" fill="#475569">↳ ReservationServiceImpl（冲突校验 · 计价）</text>
  </g>
  <g>
    <rect x="450" y="552" width="290" height="70" rx="6" fill="#ffffff" stroke="#1e6fff" stroke-width="1.8"/>
    <text x="466" y="572" font-size="12" font-weight="700" fill="#1e6fff">«interface» ReviewService</text>
    <text x="466" y="592" font-size="11.5" fill="#334155">add / listByVenue / delete</text>
    <text x="466" y="612" font-size="11.5" fill="#475569">↳ ReviewServiceImpl　CategoryServiceImpl 同理</text>
  </g>

  <!-- Service → Mapper 依赖 -->
  <path d="M740 332 L840 332" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dep)"/>
  <path d="M740 504 L840 504" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dep)"/>

  <!-- ================= 第三栏：Mapper ================= -->
  <rect x="850" y="230" width="290" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="870" y="258" font-size="14" font-weight="700" fill="#334155">mapper 数据访问层</text>
  <text x="870" y="278" font-size="11.5" fill="#64748b">接口 + XML 映射 · 动态 SQL · @Autowired 注入</text>

  <g>
    <rect x="870" y="294" width="250" height="52" rx="6" fill="#ffffff" stroke="#0f4c9c" stroke-width="1.8"/>
    <text x="886" y="314" font-size="12.5" font-weight="700" fill="#0f4c9c">UserMapper</text>
    <text x="886" y="334" font-size="11.5" fill="#475569">selectByUsername / insert / updateStatus</text>
  </g>
  <g>
    <rect x="870" y="358" width="250" height="52" rx="6" fill="#ffffff" stroke="#0f4c9c" stroke-width="1.8"/>
    <text x="886" y="378" font-size="12.5" font-weight="700" fill="#0f4c9c">VenueMapper</text>
    <text x="886" y="398" font-size="11.5" fill="#475569">selectList（动态条件 + 评分聚合子查询）</text>
  </g>
  <g>
    <rect x="870" y="422" width="250" height="52" rx="6" fill="#ffffff" stroke="#0f4c9c" stroke-width="1.8"/>
    <text x="886" y="442" font-size="12.5" font-weight="700" fill="#0f4c9c">ReservationMapper</text>
    <text x="886" y="462" font-size="11.5" fill="#475569">selectConflicts / updateStatus / insert</text>
  </g>
  <g>
    <rect x="870" y="486" width="250" height="52" rx="6" fill="#ffffff" stroke="#0f4c9c" stroke-width="1.8"/>
    <text x="886" y="506" font-size="12.5" font-weight="700" fill="#0f4c9c">ReviewMapper</text>
    <text x="886" y="526" font-size="11.5" fill="#475569">selectByVenueId / avgRating / deleteById</text>
  </g>
  <g>
    <rect x="870" y="550" width="250" height="46" rx="6" fill="#ffffff" stroke="#0f4c9c" stroke-width="1.8"/>
    <text x="886" y="570" font-size="12.5" font-weight="700" fill="#0f4c9c">CategoryMapper</text>
    <text x="886" y="588" font-size="11.5" fill="#475569">selectAll / countVenuesByCategory</text>
  </g>

  <!-- Mapper → MySQL -->
  <path d="M995 670 L995 706" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#dep)"/>
  <rect x="700" y="712" width="440" height="116" rx="10" fill="#0f4c9c"/>
  <text x="920" y="748" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MySQL　venue_reservation</text>
  <text x="920" y="776" text-anchor="middle" font-size="12" fill="#cfe0ff">Druid 连接池 · utf8mb4 · InnoDB 外键约束</text>
  <text x="920" y="800" text-anchor="middle" font-size="12" fill="#cfe0ff">user · category · venue · reservation · review</text>

  <!-- ================= 横切组件 ================= -->
  <rect x="40" y="712" width="620" height="116" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="60" y="744" font-size="14" font-weight="700" fill="#b45309">横切组件</text>
  <text x="60" y="770" font-size="12" fill="#7c2d12">LoginInterceptor　HandlerInterceptor 实现：登录校验 → 未登录 302 跳转登录页；</text>
  <text x="60" y="792" font-size="12" fill="#7c2d12">ADMIN 角色校验 → 普通用户访问 /admin/** 返回 403；排除静态资源与登录注册路径</text>
  <text x="60" y="814" font-size="12" fill="#7c2d12">Result&lt;T&gt;　统一 JSON 响应封装（success / message / data）</text>
</svg>
